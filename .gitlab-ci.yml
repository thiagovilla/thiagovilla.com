cache:
  paths:
    - .cache
    - public

stages:
  - build
  - deploy

build:
  stage: build
  image: node:18
  before_script:
    - npm install
    # - export BUILD_TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
    # - sed -i "s/REPLACE_ME/${BUILD_TIMESTAMP}/g" src/components/BuildTimestamp.js
  script:
    - npm run build
  artifacts:
    paths:
      - public
    expire_in: 1 day

deploy:
  stage: deploy
  image: alpine
  script:
    - echo "Deploying to production..."
    # The public directory is already in the correct location
  artifacts:
    paths:
      - public
  only:
    - release
    - schedules
