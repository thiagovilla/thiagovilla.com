cache:
  paths:
    - .cache
    - node_modules
    - public

stages:
  - build
  - deploy

build:
  stage: build
  image: node:18
  before_script:
    - npm install
  script:
    - npm run build
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:  # Must be named 'pages' for GitLab Pages
  stage: deploy
  image: alpine
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public  # Must include the public directory
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME
